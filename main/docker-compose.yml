version: '3.8'

services:
  # База данных для Главного модуля
  main-postgres:
    build: ./main-postgres
    container_name: testing-main-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testing_system
      POSTGRES_USER: main_module
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
      - ./main-module/init.sql:/docker-entrypoint-initdb.d/02-schema.sql
    networks:
      - testing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main_module"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Главный модуль (C++ сервер)
  main-module:
    build: ./main-module
    container_name: testing-main-module
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DB_HOST: main-postgres
      DB_PORT: 5432
      DB_NAME: testing_system
      DB_USER: main_module
      DB_PASSWORD: secret123
      SERVER_PORT: 3002
      JWT_SECRET: development_secret_key
      LOG_LEVEL: info
    depends_on:
      main-postgres:
        condition: service_healthy
    networks:
      - testing-network
    volumes:
      - ./logs:/app/logs

networks:
  testing-network:
    external: true

volumes:
  main_postgres_data:
