main-module:
  build: ./main-module
  ports:
    - "3002:3002"
  environment:
    - DB_HOST=main-postgres
    - DB_PORT=5432
    - DB_NAME=testing_system
    - DB_USER=main_module
    - DB_PASSWORD=secret123
    - JWT_SECRET=your_super_secret_key_here
  depends_on:
    - main-postgres
  networks:
    - testing-network

main-postgres:
  image: postgres:15-alpine
  environment:
    - POSTGRES_DB=testing_system
    - POSTGRES_USER=main_module
    - POSTGRES_PASSWORD=secret123
  volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  networks:
    - testing-network