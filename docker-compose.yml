version: '3.8'

services:
  web-nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./web/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-backend
    networks:
      - testing-network

  web-redis:
    image: redis:7-alpine
    container_name: testing-web-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-backend:
    build: ./web/backend
    deploy:
      replicas: 2
    environment:
      - REDIS_HOST=web-redis
      - REDIS_PORT=6379
      - PORT=3000
      - MAIN_MODULE_URL=http://main-module:3002
      - MAIN_MODULE_TIMEOUT=5000
      - NODE_ENV=production
    depends_on:
      web-redis:
        condition: service_healthy
      main-module:
        condition: service_started
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  main-postgres:
    image: postgres:15-alpine
    container_name: testing-main-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testing_system
      POSTGRES_USER: main_module
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
      - ./main/main-module/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - testing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main_module -d testing_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-module:
    build:
      context: ./main/main-module
      dockerfile: Dockerfile
    container_name: testing-main-module
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DB_HOST: main-postgres
      DB_PORT: 5432
      DB_NAME: testing_system
      DB_USER: main_module
      DB_PASSWORD: secret123
      SERVER_PORT: 3002
      JWT_SECRET: test_secret
      NODE_ENV: production
    depends_on:
      main-postgres:
        condition: service_healthy
    networks:
      - testing-network
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  testing-network:
    driver: bridge

volumes:
  redis_data:
  main_postgres_data: