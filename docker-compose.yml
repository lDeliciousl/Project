services:
  web-nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./web/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-backend
    networks:
      - testing-network

  web-redis:
    image: redis:7-alpine
    container_name: testing-web-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-backend:
    build: ./web/backend
    environment:
      - REDIS_HOST=web-redis
      - REDIS_PORT=6379
      - PORT=3000
      - MAIN_MODULE_URL=http://main-module:3002
      - MAIN_MODULE_TIMEOUT=5000
      - AUTH_MODULE_URL=http://auth-module:8001
      - NODE_ENV=production
    depends_on:
      web-redis:
        condition: service_healthy
      main-module:
        condition: service_started
      auth-module:
        condition: service_started
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  main-postgres:
    image: postgres:15-alpine
    container_name: testing-main-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testing_system
      POSTGRES_USER: main_module
      POSTGRES_PASSWORD: secret123
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
      - ./main/main-module/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - testing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main_module -d testing_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-module:
    build:
      context: ./main/main-module
      dockerfile: Dockerfile
    container_name: testing-main-module
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DB_HOST: main-postgres
      DB_PORT: 5432
      DB_NAME: testing_system
      DB_USER: main_module
      DB_PASSWORD: secret123
      SERVER_PORT: 3002
      JWT_SECRET: "N2X1iIyqrFkw3gst7HzCrN1rSTx80r1AZBw2MV+GPP8="
      NODE_ENV: production
    depends_on:
      main-postgres:
        condition: service_healthy
    networks:
      - testing-network
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auth module services
  auth-mongo:
    image: mongo:6
    container_name: auth-mongo
    restart: unless-stopped
    volumes:
      - auth_mongo_data:/data/db
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    volumes:
      - auth_redis_data:/data
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-module:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-module
    restart: on-failure:3
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://auth-mongo:27017/auth
      - REDIS_URL=redis://auth-redis:6379/0
      - GITHUB_CLIENT_ID=Ov23li79xHWsMb7icgLS
      - GITHUB_CLIENT_SECRET=449c98d9df4dc33dc9f25dd31f2af50ccd95c1f4
      - YANDEX_CLIENT_ID=bfe57c2fadb5472c888a6f7c299bc29a
      - YANDEX_CLIENT_SECRET=7a49fc5b5d09484a8b45108ae371cd5b
      - JWT_ACCESS_SECRET=N2X1iIyqrFkw3gst7HzCrN1rSTx80r1AZBw2MV+GPP8=
      - JWT_REFRESH_SECRET=KkpknwpRk1ZK/AaFLJ0bU54Z3G0fWwRj5GPHWlfwKM8=
      - WEB_CLIENT_URL=http://localhost:8000
      - GITHUB_REDIRECT_URL=http://localhost:8001/api/auth/github/callback
      - YANDEX_REDIRECT_URL=http://localhost:8001/api/auth/yandex/callback
    depends_on:
      auth-mongo:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - testing-network

  telegram-redis:
    image: redis:7-alpine
    container_name: telegram-redis
    restart: unless-stopped
    networks:
      - testing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot-logic:
    build:
      context: ./telegram/bot-logic
    container_name: telegram-bot-logic
    restart: unless-stopped
    environment:
      BOT_LOGIC_PORT: 3005
      AUTH_MODULE_URL: http://auth-module:8001
      MAIN_MODULE_URL: http://main-module:3002
      USE_REDIS: "true"
      REDIS_URL: redis://telegram-redis:6379
      REDIS_KEY_PREFIX: "telegram:"
      USE_MOCKS: "false"
      MOCK_AUTH_AUTO_APPROVE: "false"
    depends_on:
      telegram-redis:
        condition: service_healthy
      auth-module:
        condition: service_started
      main-module:
        condition: service_started
    networks:
      - testing-network

  telegram-nginx:
    build:
      context: ./telegram/nginx
    container_name: telegram-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - telegram-bot-logic
    networks:
      - testing-network

  telegram-client:
    build:
      context: ./telegram/telegram-client
    container_name: telegram-client
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: 8047964997:AAE5g7-jsNQab6IEWTPDQma7Uh5n9HDketE
      BOT_LOGIC_URL: http://telegram-nginx:8080
      RUN_TELEGRAM_CLIENT: "true"
      POLL_INTERVAL_MS: 1000
      CRON_AUTH_CHECK_MS: 15000
      CRON_NOTIFICATIONS_MS: 20000
    depends_on:
      - telegram-bot-logic
    networks:
      - testing-network

networks:
  testing-network:
    driver: bridge

volumes:
  redis_data:
  main_postgres_data:
  auth_mongo_data:
  auth_redis_data: