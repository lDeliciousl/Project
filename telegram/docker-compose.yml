services:
  redis:
    build:
      context: ./redis

  bot-logic:
    build:
      context: ./bot-logic
    environment:
      BOT_LOGIC_PORT: 3005
      AUTH_MODULE_URL: http://host.docker.internal:8001
      MAIN_MODULE_URL: http://host.docker.internal:3002
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "telegram:"
      USE_MOCKS: "false"
      MOCK_AUTH_AUTO_APPROVE: "false"
    depends_on:
      - redis

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:8080"
    depends_on:
      - bot-logic

  telegram-client:
    build:
      context: ./telegram-client
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      BOT_LOGIC_URL: http://nginx:8080
      RUN_TELEGRAM_CLIENT: "true"
      POLL_INTERVAL_MS: 1000
      CRON_AUTH_CHECK_MS: 15000
      CRON_NOTIFICATIONS_MS: 20000
    depends_on:
      - nginx
